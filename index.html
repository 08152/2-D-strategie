<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>WW2 2D Strategy Prototype</title>
<style>
  body {
    margin: 0;
    background: #222;
    color: #eee;
    font-family: sans-serif;
    overflow: hidden;
  }
  #ui {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 10;
    background: rgba(0,0,0,0.6);
    padding: 8px;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    margin: 2px;
  }
  canvas {
    display: block;
    background: #3b5b2a; /* grob: Gras */
  }
</style>
</head>
<body>
<div id="ui">
  <div>Linksklick: Soldat auswählen, dann Ziel auf Karte klicken.</div>
  <div>KI-Befehle:</div>
  <button id="cmdAttack">Angriff</button>
  <button id="cmdHold">Halten</button>
  <button id="cmdRetreat">Rückzug</button>
</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Welt / Chunk-Map (prozedural, pseudo-unendlich) ---
const CHUNK_SIZE = 256;
function noise(x, y) {
  // sehr simple Pseudo-Noise-Funktion
  const s = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
  return s - Math.floor(s);
}

function drawTerrain(cameraX, cameraY) {
  const startChunkX = Math.floor(cameraX / CHUNK_SIZE) - 1;
  const startChunkY = Math.floor(cameraY / CHUNK_SIZE) - 1;
  const endChunkX = startChunkX + Math.ceil(canvas.width / CHUNK_SIZE) + 2;
  const endChunkY = startChunkY + Math.ceil(canvas.height / CHUNK_SIZE) + 2;

  for (let cx = startChunkX; cx <= endChunkX; cx++) {
    for (let cy = startChunkY; cy <= endChunkY; cy++) {
      const chunkScreenX = cx * CHUNK_SIZE - cameraX;
      const chunkScreenY = cy * CHUNK_SIZE - cameraY;

      // Hintergrund
      ctx.fillStyle = '#3b5b2a';
      ctx.fillRect(chunkScreenX, chunkScreenY, CHUNK_SIZE, CHUNK_SIZE);

      // Bäume / Schützengräben zufällig
      for (let i = 0; i < 10; i++) {
        const nx = noise(cx * 10 + i, cy * 10 + i);
        const ny = noise(cx * 20 + i, cy * 20 + i);
        const x = chunkScreenX + nx * CHUNK_SIZE;
        const y = chunkScreenY + ny * CHUNK_SIZE;

        if (noise(cx + i, cy - i) < 0.5) {
          // Baum
          ctx.fillStyle = '#1f3d1f';
          ctx.beginPath();
          ctx.arc(x, y, 8, 0, Math.PI * 2);
          ctx.fill();
        } else {
          // Schützengraben (kleine Linie)
          ctx.strokeStyle = '#4a3b2a';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x - 10, y);
          ctx.lineTo(x + 10, y);
          ctx.stroke();
        }
      }
    }
  }
}

// --- Einheiten ---
class Unit {
  constructor(x, y, color, type) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.type = type; // 'rifle' oder 'mg'
    this.radius = 8;
    this.selected = false;

    this.target = null;
    this.speed = 60; // px pro Sekunde

    // Kampfwerte
    if (type === 'rifle') {
      this.maxAmmo = 8;
      this.fireDelay = 1.0; // Sekunde zwischen Schüssen
      this.reloadTime = 2.0;
    } else if (type === 'mg') {
      this.maxAmmo = 60;
      this.fireRate = 10; // Schuss pro Sekunde
      this.reloadTime = 5.0;
    }
    this.ammo = this.maxAmmo;
    this.reloadTimer = 0;
    this.fireTimer = 0;

    this.aiMode = 'hold'; // 'attack', 'hold', 'retreat'
  }

  update(dt) {
    // Bewegung
    if (this.target) {
      const dx = this.target.x - this.x;
      const dy = this.target.y - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 2) {
        const vx = dx / dist;
        const vy = dy / dist;
        this.x += vx * this.speed * dt;
        this.y += vy * this.speed * dt;
      } else {
        this.target = null;
      }
    }

    // Kampf-Logik (nur grob angedeutet)
    if (this.reloadTimer > 0) {
      this.reloadTimer -= dt;
      if (this.reloadTimer <= 0) {
        this.ammo = this.maxAmmo;
      }
    } else {
      if (this.type === 'rifle') {
        this.fireTimer -= dt;
        if (this.fireTimer <= 0 && this.ammo > 0 && this.aiMode === 'attack') {
          this.fireTimer = this.fireDelay;
          this.ammo--;
          // hier würdest du ein Projektil erzeugen / Gegner suchen
        } else if (this.ammo <= 0) {
          this.reloadTimer = this.reloadTime;
        }
      } else if (this.type === 'mg') {
        this.fireTimer -= dt;
        const shotInterval = 1 / this.fireRate;
        if (this.fireTimer <= 0 && this.ammo > 0 && this.aiMode === 'attack') {
          this.fireTimer = shotInterval;
          this.ammo--;
          // Projektil / Gegner-Logik
        } else if (this.ammo <= 0) {
          this.reloadTimer = this.reloadTime;
        }
      }
    }
  }

  draw(cameraX, cameraY) {
    const sx = this.x - cameraX;
    const sy = this.y - cameraY;

    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(sx, sy, this.radius, 0, Math.PI * 2);
    ctx.fill();

    if (this.selected) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, this.radius + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  containsScreenPoint(sx, sy, cameraX, cameraY) {
    const ux = this.x - cameraX;
    const uy = this.y - cameraY;
    const dist = Math.hypot(ux - sx, uy - sy);
    return dist <= this.radius + 4;
  }
}

// Spieler-Einheiten
const units = [];
// 3 blaue Karabiner-Soldaten
units.push(new Unit(0, 0, '#3fa9f5', 'rifle'));
units.push(new Unit(40, 0, '#3fa9f5', 'rifle'));
units.push(new Unit(-40, 0, '#3fa9f5', 'rifle'));
// 1 gelber MG-Soldat
units.push(new Unit(0, 60, '#ffd800', 'mg'));

// Gegner (rote Punkte, sehr simpel)
const enemies = [];
for (let i = 0; i < 10; i++) {
  enemies.push({
    x: 300 + i * 40,
    y: 0 + (i % 3) * 40,
    radius: 8,
  });
}

let cameraX = -canvas.width / 2;
let cameraY = -canvas.height / 2;

// --- Input ---
let selectedUnit = null;
let lastClickWasUnit = false;

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  // Erst schauen, ob auf eine Einheit geklickt wurde
  selectedUnit = null;
  lastClickWasUnit = false;
  for (const u of units) {
    if (u.containsScreenPoint(sx, sy, cameraX, cameraY)) {
      selectedUnit = u;
      lastClickWasUnit = true;
    }
    u.selected = (u === selectedUnit);
  }

  // Wenn vorher eine Einheit ausgewählt war und jetzt auf Boden geklickt wird → Ziel setzen
  if (!lastClickWasUnit && selectedUnit) {
    const worldX = sx + cameraX;
    const worldY = sy + cameraY;
    selectedUnit.target = { x: worldX, y: worldY };
  }
});

// einfache Kamera-Steuerung mit WASD
window.addEventListener('keydown', (e) => {
  const speed = 200;
  if (e.key === 'w') cameraY -= speed * 0.1;
  if (e.key === 's') cameraY += speed * 0.1;
  if (e.key === 'a') cameraX -= speed * 0.1;
  if (e.key === 'd') cameraX += speed * 0.1;
});

// KI-Befehle
document.getElementById('cmdAttack').onclick = () => {
  units.forEach(u => u.aiMode = 'attack');
};
document.getElementById('cmdHold').onclick = () => {
  units.forEach(u => u.aiMode = 'hold');
};
document.getElementById('cmdRetreat').onclick = () => {
  units.forEach(u => {
    u.aiMode = 'retreat';
    // Rückzug: z.B. Richtung Startposition
    u.target = { x: 0, y: 0 };
  });
};

// --- Loop ---
let lastTime = performance.now();
function loop(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  // Update
  units.forEach(u => u.update(dt));

  // Render
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTerrain(cameraX, cameraY);

  // Gegner zeichnen
  ctx.fillStyle = '#ff3333';
  for (const e of enemies) {
    const sx = e.x - cameraX;
    const sy = e.y - cameraY;
    ctx.beginPath();
    ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // Einheiten zeichnen
  units.forEach(u => u.draw(cameraX, cameraY));

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
