<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WW2 2D Strategie</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101410;
        font-family: Arial, sans-serif;
        color: white;
        user-select: none;
    }

    #game {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
        background: #273322;
    }

    #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        background: rgba(15, 18, 15, .9);
        border: 1px solid #66705b;
        border-radius: 8px;
        padding: 10px;
        min-width: 250px;
        box-shadow: 0 5px 20px rgba(0,0,0,.4);
    }

    #ui h2 {
        margin: 0 0 8px;
        font-size: 17px;
    }

    .unit {
        border: 1px solid #555;
        background: #20251e;
        padding: 7px;
        margin: 5px 0;
        border-radius: 5px;
        cursor: pointer;
    }

    .unit:hover {
        background: #30382c;
    }

    .selected {
        outline: 2px solid #fff;
    }

    .blue { color: #4ea4ff; }
    .yellow { color: #ffd83d; }
    .red { color: #ff5151; }

    #orders {
        margin-top: 8px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
    }

    button {
        color: white;
        background: #3c4935;
        border: 1px solid #68765d;
        border-radius: 4px;
        padding: 7px;
        cursor: pointer;
    }
